name: Frontend Playwright

on:
  push:
    paths:
      - "gst-compliance-frontend/**"
      - ".github/workflows/frontend-playwright.yml"
  pull_request:
    paths:
      - "gst-compliance-frontend/**"
      - ".github/workflows/frontend-playwright.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gst-compliance-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gst-compliance-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint frontend
        run: npm run lint -- src tests

      - name: Run Playwright cross-browser suite
        env:
          CI: "true"
        run: npm run test:e2e:cross-browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: gst-compliance-frontend/playwright-report
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: gst-compliance-frontend/test-results
          retention-days: 14
