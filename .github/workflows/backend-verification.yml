name: Backend Verification

on:
  push:
    paths:
      - "apps/**"
      - "config/**"
      - "tests/**"
      - "conftest.py"
      - "manage.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-verification.yml"
  pull_request:
    paths:
      - "apps/**"
      - "config/**"
      - "tests/**"
      - "conftest.py"
      - "manage.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-verification.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      USE_SQLITE_FALLBACK: "true"
      SECRET_KEY: "ci-secret-key-for-backend-verification-1234567890"
      JWT_SIGNING_KEY: "ci-jwt-signing-key-for-backend-verification-1234567890"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend test suite
        run: pytest -q
